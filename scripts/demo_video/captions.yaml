# Burned-in step labels and the cuts, for scripts/demo_video/captions.py. Labels are short on-screen step
# names, not narration (WIN_RESEARCH §8), at most two lines. A label with `number: true` gets "N · " in
# front, counted over the shots that actually ran, so a skipped shot leaves no gap. A label never calls an
# area done: a searched sector is "searched at POD x". Anything simulated says so.

style:
  # libass force_style for the subtitles filter: a small label in a dark box, bottom centre
  force_style: "FontName=Inter,FontSize=10,PrimaryColour=&H00FFFFFF,BackColour=&H99000000,BorderStyle=3,Outline=4,Shadow=0,Alignment=2,MarginV=6"
  lead_in_s: 0.3   # label appears this long after the shot starts
  lead_out_s: 0.3  # and goes this long before it ends

labels:
  call:       {text: "Sightline · the call: a hiker overdue on Mount Seymour (demo mission)"}
  photos:     {text: "Photos land · OpenCV 5 cv2.dnn ranks each one, 0.30 s per photo on a GPU\nReal HERIDAL photos on a simulated flight path", number: true}
  confirm:    {text: "A person confirms each candidate · a 0.18 detection rescued by the second look\nOpenCV 5 zoom + Nemotron 3.5 Super VL (recorded run)", number: true}
  trace:      {text: "The trace of that chain: tool call → model call → verdict → proposal → decision", number: true}
  next:       {text: "Where next: the agent proposes, a person approves", number: true}
  run:        {text: "The run: teams out, drones fly (simulated), B4 searched at POD 60 %", number: true}
  conditions: {text: "Conditions with their sources: Tavily search, quotes read word for word", number: true}
  fleet:      {text: "Degraded comms (simulated): D2 link lost, D3 degraded, Team Two relayed via D1", number: true}
  radio:      {text: "The radio desk: Sightline's briefing in NVIDIA Magpie TTS (recorded)", number: true}
  results:    {text: "The debrief: the three numbers", number: true}
  breaks:     {text: "What breaks first, said up front", number: true}
  live_link:  {text: "Live · Fleet controls cut a drone's link; drones relay a cut-off team (simulated fleet)", number: true}
  recall:     {text: "Live · gusts 50 km/h (demo override) → no flying → the agent proposes a recall", number: true}

# Silent cuts from the uncaptioned master with their own labels, in story order. A shot that didn't run is
# left out. `slot` is a black gap for a slide or a clip Dan adds in the editor. When the screen shots don't
# fit, each is trimmed from its tail by the same factor. `speed` plays a shot faster. A segment can carry
# its own `label` for this cut (it replaces the shot's label above) and a `min_s` it is never trimmed below.
cuts:
  opencv:
    max_s: 300
    lead_black_s: 12   # Dan on camera
    tail_black_s: 10   # Dan on camera, close
    segments:
      - call
      - photos
      - confirm
      - trace
      - next
      - run
      - conditions
      - results
      - {shot: breaks, min_s: 12}   # never trimmed below 12 s: the three lines stay up >= 6 s
      - {slot: evidence index, s: 30}
      - {slot: reproduce in 5 min, s: 30}
      - {slot: limits, s: 20}
  nebius:
    max_s: 180
    lead_black_s: 10
    tail_black_s: 10
    segments:
      - {shot: call, speed: 2}
      - {shot: confirm, speed: 1.5, label: "A 0.18 detection rescued by the second look\nNemotron 3.5 Super VL on Nebius Token Factory (recorded run)"}
      - {shot: run, speed: 1.5}
      - fleet
      - live_link
      - {shot: recall, speed: 1.25}     # the Tavily moment: gusts -> no-fly -> recall, the cited source on the card
      - radio
      - {shot: breaks, min_s: 12}
      - {slot: architecture, s: 15}

# The README GIF: 16-20 s from the first candidate (in this order of preference) with enough moving in
# it (mean frame-to-frame change >= min_motion, on 0-255 grey); the window's end is the frame within ±2 s
# closest to its first, and the last half second fades back to the first frame, so it loops cleanly.
gif:
  duration_s: 18     # the loop's end is picked within +-2 s of this: never over 20 s
  fps: 10
  width: 800
  max_mb: 3
  min_motion: 0.5
  # first choice: the 18 s that end with the run: the visitor approves Team One for A1, the clock runs
  # on, the teams go out, the simulated drones fly and B4 is searched at POD 60 %
  candidates:
    - {shot: run, end_aligned: true, min_motion: 0.05}   # a console holds still more than a scan
    - photos
    - confirm
    - fleet
