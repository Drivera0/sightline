# Burned-in step labels, camera moves and the cuts, for scripts/demo_video/captions.py. Labels are short
# on-screen step names, not narration (WIN_RESEARCH §8): at most two lines of 42 characters with the
# number (captions.py wraps a long line at a space and stops on a label that would need a third), on
# screen at least 1.2 s. A label with `number: true` gets "N · " in front, counted over the shots that
# actually ran, so a skipped shot leaves no gap. A label never calls an area done: a searched sector is
# "searched at POD x". Anything simulated or recorded says so.

style:
  # libass force_style for the subtitles filter: a small label in a dark box, bottom centre. Burned into
  # the 1080p program after the camera moves, so the type stays sharp and still.
  force_style: "FontName=Inter,FontSize=10,PrimaryColour=&H00FFFFFF,BackColour=&H99000000,BorderStyle=3,Outline=4,Shadow=0,Alignment=2,MarginV=6"
  lead_in_s: 0.3   # label appears this long after the shot starts
  lead_out_s: 0.3  # and goes this long before it ends

labels:
  call:       {text: "Sightline · the call: a hiker overdue\non Mount Seymour (demo mission)"}
  photos:     {text: "OpenCV 5 cv2.dnn ranks each photo\nReal HERIDAL photos, simulated flight path", number: true}
  confirm:    {text: "Second look rescues a 0.18 detection\nOpenCV 5 + Nemotron 3.5 Super VL, recorded", number: true}
  trace:      {text: "The trace: tool call → model call →\nverdict → proposal → decision", number: true}
  next:       {text: "Where next: the agent proposes,\na person approves", number: true}
  run:        {text: "Teams out, drones fly (simulated)\nB4 searched at POD 60 %", number: true}
  conditions: {text: "Conditions with their sources:\nTavily search, quotes read word for word", number: true}
  fleet:      {text: "Simulated comms: D2 link lost\nD3 degraded, Team Two relayed via D1", number: true}
  radio:      {text: "The radio desk: Sightline's briefing\nin NVIDIA Magpie TTS (recorded)", number: true}
  results:    {text: "The debrief: the three numbers", number: true}
  breaks:     {text: "What breaks first, said up front", number: true}
  live_link:  {text: "Live · Fleet controls cut a link\ndrones relay a cut-off team (simulated)", number: true}
  recall:     {text: "Live · gusts 50 km/h (demo override)\nno flying → the agent proposes a recall", number: true}

# The program (master.mp4), rendered from the 4K master at this size (`--size 2560x1440` for the 1440p
# upload). zoompan works on the master scaled up `upscale` times first: it rounds its crop to whole
# pixels and shakes otherwise (ffmpeg trac #4298).
program:
  size: [1920, 1080]
  upscale: 2

# Camera moves and pacing per shot (moves.py). Coordinates are the 1920x1080 viewport's CSS pixels; times
# are seconds into the shot as recorded.
#   push_in: {x, y, scale, start, end}  zoom 1 -> scale about (x, y) from start to end, ease-in-out;
#                                       `focus: click` = the shot's last click; default the centre, whole shot
#   hold: true | {x, y, scale}          no move, or a still crop
#   speed: 1.5 | [{start, end, rate}]   the shot, or a wait inside it, played faster (setpts, after the move)
# `default` is for a shot without its own entry: a gentle push over the whole shot, so no full screen
# stays still for long.
moves:
  default:    {push_in: {scale: 1.08}}
  call:       {push_in: {focus: click, scale: 1.12}}   # towards the pitch bar's Follow the search
  photos:     {push_in: {x: 1560, y: 540, scale: 1.08}, speed: [{start: 2.0, end: 7.0, rate: 1.5}]}  # the rail and the map; the clock's run to t1 at 1.5x

# Silent cuts from the uncaptioned master with their own labels, in story order. A shot that didn't run is
# left out. `slot` is a black gap for a slide or a clip Dan adds in the editor. When the screen shots don't
# fit, each is trimmed from its tail by the same factor. `speed` plays a shot faster. A segment can carry
# its own `label` for this cut (it replaces the shot's label above) and a `min_s` it is never trimmed below.
cuts:
  opencv:
    max_s: 300
    lead_black_s: 12   # Dan on camera
    tail_black_s: 10   # Dan on camera, close
    segments:
      - call
      - photos
      - confirm
      - trace
      - next
      - run
      - conditions
      - results
      - {shot: breaks, min_s: 12}   # never trimmed below 12 s: the three lines stay up >= 6 s
      - {slot: evidence index, s: 30}
      - {slot: reproduce in 5 min, s: 30}
      - {slot: limits, s: 20}
  nebius:
    max_s: 180
    lead_black_s: 10
    tail_black_s: 10
    segments:
      - {shot: call, speed: 2}
      - {shot: confirm, speed: 1.5, label: "0.18 rescued by Nemotron 3.5 Super VL\non Nebius Token Factory (recorded run)"}
      - {shot: run, speed: 1.5}
      - fleet
      - live_link
      - {shot: recall, speed: 1.25}     # the Tavily moment: gusts -> no-fly -> recall, the cited source on the card
      - radio
      - {shot: breaks, min_s: 12}
      - {slot: architecture, s: 15}

# The README GIF: <= 16 s from the first candidate (in this order of preference) with enough moving in
# it (mean frame-to-frame change >= min_motion, on 0-255 grey); the window's end is the frame within
# -2 s .. +slack of duration_s closest to its first (never past max_s), and the last half second fades back
# to the first frame, so it loops cleanly. Over max_mb it keeps fps and width and tries, in order, each
# source (capture: the 4K recording, no camera moves, small frame diffs; program: the captioned program,
# whose push-ins make it about 15 times larger), the window shortened by shorten_s, then fewer colours.
gif:
  duration_s: 16
  max_s: 16          # the loop, after its half-second fade
  min_s: 8
  fps: 12
  width: 960
  max_mb: 3
  min_motion: 0.5
  sources: [capture, program]
  shorten_s: [0, 3, 6]
  colors: [256, 128, 64]
  # first choice: next -> run: the visitor confirms Team One's radio clue, the agent proposes Team One
  # for C2, the proposal is approved, and the drones fly (Drone 2 losing its link) as the teams go out
  candidates:
    - {shot: next, offset_s: 7.3, min_motion: 0.05}   # a console holds still more than a scan
    - {shot: run, end_aligned: true, min_motion: 0.05}
    - photos
    - confirm
    - fleet
