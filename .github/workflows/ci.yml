# Every push to main and every pull request: the Python tests and lint, the smoke test (the whole live
# loop with fakes: no network, no keys), and the web typecheck, tests and offline build check. LANE_D
# D-S1 asks for smoke to be green on main every day; this makes it so.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra conditions # no ml extra: the tests use fakes (2 torch tests skip)
      - run: uv run --frozen ruff check sightline tests scripts
      - run: uv run --frozen ruff format --check sightline tests scripts
      - run: uv run --frozen pytest -q --timeout 900
      - run: python docs/report/check_evidence_index.py
      - run: bash scripts/smoke.sh
        env:
          SIGHTLINE_FAKE_LLM: "1"
          SIGHTLINE_FAKE_TAVILY: "1"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit
      - run: pnpm exec vitest run
      - run: pnpm check:offline
