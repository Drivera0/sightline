# Is the judging endpoint up? Every 6 hours (and by hand): scripts/remote_check.py --read-only against
# the live API: HTTPS + /health, CORS for the Vercel site, an earlier mission still there, its event
# stream, a 404. Read-only on purpose: no credentials, no HERIDAL photo, no model tokens, and no test
# missions left on the public box. On failure it opens (or comments on) one issue, "Judging endpoint
# check failed", with the output; the next passing run closes it. What to do then: deploy/aws/README.md,
# "During judging".
#
# Repository variables (no secrets needed):
#   gh variable set API_URL --body https://<ip-with-dashes>.sslip.io   # default below
#   gh variable set MISSION --body <an earlier mission id>              # optional: adds two checks
#   gh variable set JUDGING_CHECK --body off                            # pause it (box stopped on purpose)
name: judging-check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: judging-check
  cancel-in-progress: false

env:
  API_URL: ${{ vars.API_URL || 'https://44-227-39-234.sslip.io' }}
  MISSION: ${{ vars.MISSION }}
  TITLE: Judging endpoint check failed
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  check:
    if: vars.JUDGING_CHECK != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Remote check (read-only)
        id: check
        run: |
          set -o pipefail
          args=(--api "$API_URL" --read-only)
          if [ -n "$MISSION" ]; then args+=(--mission "$MISSION"); fi
          # The script needs only the standard library: --no-project skips installing the project.
          uv run --no-project python scripts/remote_check.py "${args[@]}" 2>/dev/null | tee check.txt
      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        run: |
          {
            echo "Run: $RUN_URL ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo
            echo '```'
            cat check.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo 'What to do: deploy/aws/README.md, "During judging". This issue closes itself when a check passes.'
          } > body.md
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
      - name: Close the issue when the check passes
        if: success()
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "Passed again: $(head -1 check.txt) ($RUN_URL)"
          fi
