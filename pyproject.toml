[project]
name = "sightline"
version = "0.1.0"
description = "Finds people in search-and-rescue drone photos and keeps a Bayesian search map."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pillow",
    "shapely",
    "pydantic>=2",
    "typer",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",  # the photo clients (sightline/client)
    "openai>=3.35.1",
    "tavily-python>=0.8.5",
    "python-dotenv>=1.2.4",
    "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "ultralytics",
    "sahi",
    "onnx>=1.23.2",
    "onnxslim>=0.1.98",
]
# Contract v1.2 (LANE_D §4). openai and tavily-python are also base dependencies today.
# The radio's NeMo models (Parakeet, Magpie) are not an extra: NeMo pins its own Lightning and
# torch, so it lives in its own environment (sightline/radio/README.md).
agent = ["openai>=3.35.1"]
conditions = ["tavily-python>=0.8.5", "astral"]
aws = ["boto3"]
sim = ["piexif"]
# The demo-video recorder (scripts/demo_video): Playwright drives Chromium, PyYAML reads the captions.
video = ["playwright==1.64.0", "pyyaml>=6"]
# INT8 experiment only (scripts/quantize_onnx.py, docs/report/INT8_ENGINE.md): not a run-time dep.
quant = ["onnxruntime==1.30.0"]

[dependency-groups]
dev = ["pytest", "ruff", "matplotlib", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sightline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
