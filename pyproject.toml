[project]
name = "sightline"
version = "0.1.0"
description = "Finds people in search-and-rescue drone photos and keeps a Bayesian search map."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pillow",
    "shapely",
    "pydantic>=2",
    "typer",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "openai>=3.35.1",
    "tavily-python>=0.8.5",
    "python-dotenv>=1.2.4",
    "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "ultralytics",
    "sahi",
    "onnx>=1.23.2",
    "onnxslim>=0.1.98",
]

[dependency-groups]
dev = ["pytest", "ruff", "matplotlib", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sightline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
